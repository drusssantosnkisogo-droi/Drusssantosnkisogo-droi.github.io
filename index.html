
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Portfolio personal de un estudiante de Desarrollo de Aplicaciones Web.">

    <title>Mi Portfolio</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =====================================
         BARRA DE NAVEGACIÓN PRINCIPAL
         ===================================== -->

    <!-- Navbar crea la barra de navegación.
         navbar-expand-lg permite mostrar el menú
         desplegado en pantallas grandes y plegado
         en dispositivos pequeños. -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <!-- container centra el contenido y limita su anchura -->
        <div class="container">

            <!-- Nombre o logotipo del portfolio -->
            <a class="navbar-brand fw-bold" href="#">
                Mi Portfolio
            </a>

            <!-- Botón que permite abrir y cerrar el menú
                 en móviles y tabletas -->
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal"
                    aria-expanded="false"
                    aria-label="Abrir menú de navegación">

                <!-- Icono de las tres líneas del menú -->
                <span class="navbar-toggler-icon"></span>

            </button>

            <!-- Contenedor de los enlaces de navegación -->
            <div class="collapse navbar-collapse" id="menuPrincipal">

                <!-- ms-auto coloca los enlaces a la derecha -->
                <ul class="navbar-nav ms-auto">

                    <!-- Enlace a la portada -->
                    <li class="nav-item">
                        <a class="nav-link active" href="#inicio">Inicio</a>
                    </li>

                    <!-- Enlace a la sección sobre mí -->
                    <li class="nav-item">
                        <a class="nav-link" href="#sobre-mi">Sobre mí</a>
                    </li>

                    <!-- Enlace a la sección de proyectos -->
                    <li class="nav-item">
                        <a class="nav-link" href="#proyectos">Proyectos</a>
                    </li>

                    <!-- Enlace a la sección de habilidades -->
                    <li class="nav-item">
                        <a class="nav-link" href="#habilidades">Habilidades</a>
                    </li>

                    <!-- Enlace a la sección de contacto -->
                    <li class="nav-item">
                        <a class="nav-link" href="#contacto">Contacto</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

</body>
</html>
